<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>両替シミュレーター</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<h1>両替戦略シミュレーター</h1>

<!-- 通貨ペア選択 -->
<div>
  <label for="pairSelect">通貨ペア:</label>
  <select id="pairSelect"></select>
</div>

<!-- Entryセクション -->
<div id="entrySection" class="card">
  <h2>Entry（両替情報）</h2>
  <label>両替額: <input type="number" id="entryAmount" step="0.01"></label><br>
  <label>合計手数料: <input type="number" id="entryFee" step="0.01"></label><br>
  <label>為替レート: <input type="number" id="entryRate" step="0.0001"></label>
</div>

<!-- 計算ボタン -->
<button id="calcBtn">計算する</button>

<!-- 結果セクション -->
<div id="resultSection" class="card">
  <h2>計算結果</h2>
  <p id="receivedAmount"></p>
  <p id="breakEvenRate"></p>
  <p id="calcAmount"></p>
</div>

<script src="script.js"></script>
</body>
</html>
