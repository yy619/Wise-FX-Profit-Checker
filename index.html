<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Wise FX Profit Checker</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="container">
<h1>Wise FX Profit Checker</h1>

<div class="card">
<h2>通貨設定</h2>
<label>元通貨</label>
<select id="baseCurrency">
<option>USD</option>
<option>CAD</option>
<option>HKD</option>
<option>JPY</option>
</select>

<label>変換先通貨</label>
<select id="targetCurrency">
<option>JPY</option>
<option>USD</option>
<option>CAD</option>
<option>HKD</option>
</select>
</div>

<div class="card">
<h2>両替情報</h2>
<label>両替額（元通貨）</label>
<input type="number" id="amount" placeholder="例: 100">

<label>合計手数料（元通貨）</label>
<input type="number" id="fee" placeholder="例: 0.5">

<label>為替レート（買ったとき）</label>
<input type="number" id="rate" placeholder="例: 148">
</div>

<div class="card">
<button id="calcBtn">計算する</button>
</div>

<div class="card">
<h2>計算結果</h2>
<div class="result-grid">
<div>
<h3>受領額（自動計算）</h3>
<p id="received">-</p>
</div>

<div>
<h3>損益分岐レート</h3>
<p id="breakEven">-</p>
</div>
</div>
</div>

<script src="script.js"></script>
</body>
</html>
